model:
  base_model_id: "ibm-granite/granite-3.3-8b-instruct"
  base_model_dir: "models/granite-3.3-8b-instruct"
  torch_dtype: "bfloat16"

runtime:
  default_model_profile: "teacher"
  verifier_model_profile: "base"
  model_profiles:
    base:
      adapter_path: null
      description: "Base Granite instruct model with no LoRA adapter."
    general:
      adapter_path: "runs/20260313_140305_general_train/adapter"
      description: "Base model plus the cybersecurity adapter."
    teacher:
      adapter_path: "runs/20260313_142348_teacher_train/adapter"
      description: "Base model plus the teacher-customized adapter."

rag:
  chunk: 512
  overlap: 50
  topk: 3
  teacher_fallback_topk: 2
  collections:
    general: "general_chunks"
    teacher: "teacher_chunks"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - up_proj
    - down_proj
    - gate_proj

training:
  lr: 0.0002
  batch: 1
  grad_accum: 8
  epochs: 1
  max_seq_len: 2048

data:
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/eval.jsonl"

output:
  runs_dir: "runs"
  chroma_dir: "chroma"
  adapter_subdir: "adapter"
